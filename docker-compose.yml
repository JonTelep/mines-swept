version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mineswept-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - mineswept-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mineswept-frontend
    ports:
      - "5000:5000"
    environment:
      - REACT_APP_SOCKET_URL=http://localhost:3001
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - mineswept-network

networks:
  mineswept-network:
    driver: bridge
