<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#140e0a" />
  <meta name="description" content="One infinite minesweeper board. Everyone plays it at once. No account." />
  <meta property="og:title" content="minesSwept — one board, everybody" />
  <meta property="og:description" content="An infinite minesweeper board the whole internet digs together. No account. Reveals stick." />
  <meta property="og:image" content="https://mines.telep.io/og.png" />
  <meta property="og:url" content="https://mines.telep.io" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="minesSwept — one board, everybody" />
  <meta name="twitter:description" content="An infinite minesweeper board the whole internet digs together." />
  <meta name="twitter:image" content="https://mines.telep.io/og.png" />
  <title>minesSwept</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>

  <header class="top">
    <h1>mines<em>Swept</em></h1>
    <p class="live"><span class="pip" id="pip"></span><span id="online">tuning in</span></p>
  </header>

  <section class="ticket" aria-label="Score">
    <button type="button" id="name" class="name">…</button>
    <p class="score" id="score">0</p>
    <p class="score-label">your score</p>
    <p class="personal" id="personal">0 dug · 0 mines</p>
    <div class="cool" id="cool" hidden>
      <span id="cool-fill"></span>
      <em id="cool-label">in the crater</em>
    </div>
    <p class="everyone" id="everyone"><strong>0</strong> dug together</p>
  </section>

  <section class="notes" id="notes" aria-label="Field notes">
    <div class="notes-head">
      <h2>Field notes</h2>
      <button type="button" id="close-notes">Close</button>
    </div>
    <ol id="leaders"></ol>
    <div class="who" id="who"></div>
    <p class="ticker" id="ticker">The ground is quiet.</p>
    <p class="legal"><a href="https://www.gnu.org/licenses/gpl-3.0.html">GPL-3.0</a></p>
  </section>

  <div class="dock">
    <p id="coords" class="coords">0, 0</p>
    <div class="tools">
      <button type="button" id="flag-mode" aria-pressed="false">Flag</button>
      <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="origin">Origin</button>
      <button type="button" id="share">Share</button>
      <button type="button" id="sound" aria-pressed="false">Sound</button>
      <button type="button" id="notes-toggle">Notes</button>
    </div>
  </div>

  <p class="hint" id="hint">Tap to dig. Hold to flag. Everyone is on this same board.</p>
  <p class="toast" id="toast" role="status"></p>
  <div id="live" class="sr" aria-live="polite"></div>
  <script src="/client.js" type="module"></script>
</body>
</html>
